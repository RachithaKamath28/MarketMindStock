<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - MarketMind</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='auth.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='theme.css') }}">
    <script>try{document.documentElement.dataset.theme=localStorage.getItem('marketmind-theme')||'dark'}catch(e){document.documentElement.dataset.theme='dark'}</script>
    <script src="{{ url_for('static', filename='theme.js') }}" defer></script>
</head>
<body>
    <button type="button" id="authThemeToggle" class="theme-toggle auth-theme-toggle" aria-label="Switch to light mode">☀️ Light mode</button>
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <h1>MARKETMIND</h1>
                <p>Sign in to access the terminal.</p>
            </div>
            
            <form method="POST" class="auth-form">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" required>
                </div>
                
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required>
                </div>
                
                {% with messages = get_flashed_messages() %}
                    {% if messages %}
                        <div class="error-message">
                            {{ messages[0] }}
                        </div>
                    {% endif %}
                {% endwith %}
                
                <button type="submit" class="auth-btn">Sign In</button>
            </form>
            
            <div class="auth-links">
                <p>Don't have an account? <a href="{{ url_for('register') }}">Sign Up</a></p>
            </div>
        </div>
    </div>
</body>
</html>
