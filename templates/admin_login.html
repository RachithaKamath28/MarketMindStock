<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Review Admin Login</title><link rel="stylesheet" href="{{ url_for('static',filename='reviews.css') }}"></head><body class="reviews-page"><main class="review-shell narrow"><h1>Private review administration</h1><form class="review-card" method="post"><label>Administrator username</label><input name="username" required autocomplete="username"><label>Password</label><input type="password" name="password" required autocomplete="current-password"><button class="primary" type="submit">Sign in</button>{% for message in get_flashed_messages() %}<p class="error">{{message}}</p>{% endfor %}</form></main></body></html>
